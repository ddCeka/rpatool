name: Release rpatool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g., v1.4.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test-and-release:
    name: Test and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest -v test_rpatool.py

      - name: Verify script version and prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp rpatool.py dist/rpatool.py
          chmod +x dist/rpatool.py
          python dist/rpatool.py --version
          sha256sum dist/rpatool.py > dist/rpatool.py.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: rpatool ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/rpatool.py
            dist/rpatool.py.sha256
